  .fallback.show{display:block;}

  .you-marker{position:relative;width:18px;height:18px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 2px var(--you);}
  .you-marker::after{content:'';position:absolute;inset:-12px;border-radius:50%;background:var(--you);opacity:.25;animation:pulse 2.2s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.4);opacity:.35;}100%{transform:scale(1.6);opacity:0;}}
  @media (prefers-reduced-motion:reduce){.you-marker::after{animation:none;display:none;}}
  .star-icon{background:none;border:none;}
  .star-icon svg{display:block;width:26px;height:26px;margin:2px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35));}

  .leaflet-popup-content .ln{color:#2B3544;}

const R_MI = 3958.8, M_PER_MI = 1609.34;
const rad = d => d * Math.PI / 180;
function miles(a, b, c, d){
  const dLat = rad(c - a), dLon = rad(d - b);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(dLon/2)**2;
  return R_MI * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normType(t){
  t = String(t || '').trim().toLowerCase();
  return t === 'insurance' ? 'Insurance' : t === 'retail' ? 'Retail' : 'Unknown';
}
function normRow(r){
  const g = k => { const key = Object.keys(r).find(x => x.trim().toLowerCase() === k); return key ? String(r[key] == null ? '' : r[key]).trim() : ''; };
  const lat = parseFloat(g('lat')), lng = parseFloat(g('lng'));
  if (isNaN(lat) || isNaN(lng)) return null;
  // Only the public fields are read; any other columns in a sheet are ignored.
  return { street: g('street'), city: g('city'), lat, lng, type: normType(g('type')),
           insurance: g('insurance'), shingle: g('shingle'), shingle_color: g('shingle_color') };
}
let dataPromise = null;
function loadData(){
  if (dataPromise) return dataPromise;
  const inline = INLINE_DATA.map(normRow).filter(Boolean);
  dataPromise = new Promise(resolve => {
    if (!CONFIG.csvUrl) return resolve(inline);
    Papa.parse(CONFIG.csvUrl, { download: true, header: true, skipEmptyLines: true,
      complete: res => { const rows = res.data.map(normRow).filter(Boolean); resolve(rows.length ? rows : inline); },
      error: () => resolve(inline) });
  });
  return dataPromise;
}

const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.8 5.6 21.4 7 14.3 1.7 9.3l7.2-.9z" fill="#F5B700" stroke="#3A2C00" stroke-width="1.1" stroke-linejoin="round"/></svg>';
const starIcon = L.divIcon({ className: 'star-icon', html: STAR_SVG, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14] });
const youIcon = L.divIcon({ className: '', html: '<div class="you-marker"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });

function popupHtml(p){
  const lines = [];
  const addr = [p.street, p.city].filter(Boolean).join(', ');
  lines.push('<div class="addr">' + esc(addr || 'Roof replacement') + '</div>');
  if (p.type === 'Insurance') lines.push('<div class="ln">' + (p.insurance ? 'Insurance: ' + esc(p.insurance) : 'Insurance claim') + '</div>');
  else if (p.type === 'Retail') lines.push('<div class="ln">Retail replacement</div>');
  if (p.shingle) lines.push('<div class="ln">Shingle: ' + esc(p.shingle) + '</div>');
  if (p.shingle_color) lines.push('<div class="ln">Color: ' + esc(p.shingle_color) + '</div>');
  lines.push('<div class="dist">' + p.dist.toFixed(1) + ' mi away</div>');
  return lines.join('');
}

let map, circle, layer, centerLabel = 'you';
function initMap(c){
  map = L.map('map', { zoomControl: true, tap: true }).setView(c, 13);
  L.tileLayer(CONFIG.tileUrl, { maxZoom: 19, attribution: CONFIG.tileAttribution }).addTo(map);
  map.zoomControl.setPosition('bottomright');
  layer = L.layerGroup().addTo(map);
}
function render(c, points, denied){
  const r = CONFIG.radiusMiles;
  const all = points.map(p => Object.assign({ dist: miles(c.lat, c.lng, p.lat, p.lng) }, p)).sort((a, b) => a.dist - b.dist);
  let shown = all.filter(p => p.dist <= r), fallbackList = false;
  if (!shown.length && all.length){ fallbackList = true; shown = all.slice(0, CONFIG.fallbackCount); }
  layer.clearLayers();
  if (circle) map.removeLayer(circle);
  circle = L.circle([c.lat, c.lng], { radius: r * M_PER_MI, color: '#2563EB', weight: 1.5, fillColor: '#2563EB', fillOpacity: .06, interactive: false }).addTo(map);
  if (!denied) L.marker([c.lat, c.lng], { icon: youIcon, zIndexOffset: -500, keyboard: false, interactive: false }).addTo(layer);
  shown.forEach(p => {
    L.marker([p.lat, p.lng], { icon: starIcon, title: [p.street, p.city].filter(Boolean).join(', ') })
      .bindPopup(popupHtml(p), { maxWidth: 260 }).addTo(layer);
  });
  const b = L.latLngBounds([[c.lat, c.lng]]).extend(circle.getBounds());
  if (fallbackList) shown.forEach(p => b.extend([p.lat, p.lng]));
  map.fitBounds(b, { paddingTopLeft: [10, 70], paddingBottomRight: [10, denied ? 150 : 10], maxZoom: 15 });
  const n = shown.length, el = document.getElementById('stat-line');
  if (fallbackList) el.innerHTML = 'No roofs replaced within ' + r + ' miles yet. Showing the <span class="stat-count">' + n + '</span> nearest';
  else if (denied) el.innerHTML = '<span class="stat-count">' + n + '</span> roof' + (n === 1 ? '' : 's') + ' replaced within ' + r + ' miles of Knoxville';
  else el.innerHTML = '<span class="stat-count">' + n + '</span> roof' + (n === 1 ? '' : 's') + ' replaced within ' + r + ' miles of you';
}
function useFallback(points){
  const c = { lat: CONFIG.fallbackCenter[0], lng: CONFIG.fallbackCenter[1] };
  if (!map) initMap(CONFIG.fallbackCenter);
  document.getElementById('fallback').classList.add('show');
  render(c, points, true);
}
async function locate(){
  const points = await loadData();
  document.getElementById('fallback').classList.remove('show');
  document.getElementById('stat-line').textContent = 'Locating you…';
  if (!navigator.geolocation){ useFallback(points); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const c = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (!map) initMap([c.lat, c.lng]);
      document.getElementById('fallback').classList.remove('show');
      render(c, points, false);
    },
    () => useFallback(points),
    { timeout: 10000, maximumAge: 60000, enableHighAccuracy: false });
}
document.getElementById('retry-btn').addEventListener('click', locate);
locate();
</script>
